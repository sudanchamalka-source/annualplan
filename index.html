.card h2,.card h3,.brand .ttl,.tabs button,.pg h1.st,.pg h2.sh,.pg h3.sh3,.cov-title,.vmb b,.cov-mid .vm b{font-family:'Yaldevi','Noto Sans Sinhala','AL',sans-serif}
#app header.brand{background:linear-gradient(90deg,#0f3d73,#1a5fa8 55%,#2f80d1);color:#fff;padding:18px 24px;text-align:center}
.brand h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.5px}
.brand p{margin:2px 0 0;font-style:italic;opacity:.92;font-size:15px}
.brand .ttl{margin-top:0;font-size:21px;font-weight:700;background:rgba(255,255,255,.14);display:inline-block;padding:4px 14px;border-radius:20px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid var(--pb);position:sticky;top:0;z-index:5}
.bar button{border:1px solid var(--pb);background:var(--pl);color:var(--p);padding:7px 12px;border-radius:8px;cursor:pointer}
.bar button.pri{background:var(--p);color:#fff;border-color:var(--p)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:#dfeaf7}
.tabs{gap:6px;padding:10px}
.tabs button{flex:0 0 auto;border:2px solid var(--c,#1a5fa8);background:#fff;color:var(--c,#1a5fa8);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-weight:700;transition:all .2s ease}
.tabs button:hover{background:var(--c);color:#fff;transform:translateY(-3px);box-shadow:0 5px 12px rgba(0,0,0,.25)}
.tabs button.on{background:var(--c);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.bar button{transition:all .2s ease}
.bar button:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.2);background:#2f80d1;color:#fff}
.bar button:nth-child(2):hover{background:#16a085}.bar button:nth-child(3):hover{background:#e67e22}.bar button:nth-child(4):hover{background:#c0392b}.bar button.pri:hover{background:#0f3d73}
main{max-width:1150px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,80,160,.08)}
.card h2{margin:0 0 10px;color:var(--p);font-size:22px}
.card h3{margin:16px 0 8px;color:var(--p2);font-size:18px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
label.f{display:block;font-size:14px;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{border:1px solid #a9c6e6;border-radius:7px;padding:6px 8px;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--p2);border-color:var(--p2)}
.tw{overflow-x:auto}
table.et{border-collapse:collapse;width:100%;font-size:15px}
table.et th,table.et td{border:1px solid #b9d3ee;padding:3px;text-align:center}
table.et th{background:var(--pl);color:var(--p);font-weight:700}
table.et td input,table.et td select{width:100%;min-width:56px;border:0;background:transparent;text-align:center;padding:5px 3px}
table.et td input.l{text-align:left;min-width:160px}
table.et td.c{background:#f1f9ee;font-weight:700;color:var(--g)}
table.et td.x{width:34px}
.del{border:0;background:#fde8e8;color:var(--red);border-radius:6px;cursor:pointer;padding:3px 7px}
.add{border:1px dashed var(--p2);background:#fff;color:var(--p);border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:8px}
.imgbox{border:2px dashed var(--pb);border-radius:10px;padding:10px;text-align:center;background:#f5f9fe}
.imgbox img{max-width:100%;max-height:320px;display:block;margin:8px auto;border-radius:6px}
.swot{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.swot div{border-radius:10px;padding:10px}
.chk{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.qb{display:flex;gap:2px;justify-content:center}
.qb span{width:26px;height:26px;line-height:26px;border-radius:5px;background:#eee;cursor:pointer;font-size:13px;user-select:none}
.qb span.on{background:var(--p);color:#fff}
.navb{display:flex;justify-content:space-between;margin-top:6px}
.navb button{background:var(--p);color:#fff;border:0;padding:9px 18px;border-radius:8px;cursor:pointer}
.navb button:disabled{opacity:.3}
footer.ft{text-align:center;color:#fff;background:#0f3d73;padding:12px;font-size:14px;margin-top:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 20px;border-radius:24px;display:none;z-index:99}
.area{border:1px solid var(--pb);border-radius:10px;padding:10px;margin-bottom:14px}
.area .ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.area .ah input{flex:1;font-weight:700;min-width:220px}
.red{color:var(--red)}

/* ===== REPORT ===== */
#report{display:none;background:#888;padding:16px 0}
#report .rbar{position:sticky;top:0;background:#0f3d73;color:#fff;padding:10px;text-align:center;z-index:9}
#report .rbar button{margin:0 5px;padding:7px 14px;border-radius:8px;border:0;cursor:pointer}
.pg{width:297mm;min-height:210mm;margin:12px auto;background:#fff;padding:11mm 13mm 14mm;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:12.5pt;color:#000}
.pg.green{background:var(--green)}
.pg .pn{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font-size:10pt;color:#444}
.pg h1.st{text-align:center;font-size:19pt;margin:0 0 8px;padding:6px;border:1.5px solid #000}
.pg h2.sh{font-size:15pt;margin:10px 0 6px;background:#5b6770;color:#fff;padding:4px 10px;text-align:center}
.pg h3.sh3{font-size:13pt;margin:8px 0 4px}
table.rt{border-collapse:collapse;width:100%;font-size:10.5pt;margin-bottom:6px}
table.rt th,table.rt td{border:1px solid #000;padding:3px 4px;text-align:center;vertical-align:middle}
table.rt th{background:#eee;font-weight:700}
table.rt td.l{text-align:left}
table.rt tr{break-inside:avoid}
table.rt thead{display:table-header-group}
.cov-title{border:2px solid #000;text-align:center;padding:6px 10px;margin-bottom:10px}
.cov-title .sn{font-size:20pt;font-weight:700}
.cov-title .t2{font-size:20pt;font-weight:700}
.cov-mid{display:grid;grid-template-columns:1fr 2.4fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.cov-mid .vm{text-align:center;font-size:12pt}
.cov-mid .vm b{display:block;font-size:15pt;margin-bottom:5px}
.cov-mid img{width:100%;max-height:96mm;object-fit:cover;border:1px solid #000}
.noimg{border:1px dashed #999;height:80mm;display:flex;align-items:center;justify-content:center;color:#888}
.ri{max-width:100%;max-height:150mm;display:block;margin:6px auto;border:1px solid #999}
.rswot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rswot>div{border:2px solid;border-radius:14px;padding:8px 12px;min-height:60mm}
.rswot h4{margin:0 0 4px;font-size:14pt}
.rswot ul{margin:0;padding-left:18px;font-size:11pt}
.flex2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:start}
.ch{width:100%;height:auto}
.vmb{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 10px}
.vmb>div{border:2px solid #000;padding:10px;min-height:32mm;text-align:center}
.vmb b{font-size:16pt;display:block;margin-bottom:5px}
.cols{display:grid;gap:4px}
.sig{display:grid;grid-template-columns:1fr 1fr;margin-top:18mm;text-align:center}
.appr{font-size:14pt;line-height:2}
.fm{font-size:11pt;margin:2px 0 6px}
table.rt.f3{font-size:8pt}table.rt.f3 th,table.rt.f3 td{padding:2px 1px}
table.rt.f3 th.mo{width:5.5mm;font-size:7.5pt}
.band{background:#5b6770;color:#fff;font-weight:700;text-align:left;padding:3px 8px}
.olr{margin:0;padding-left:20px;text-align:left;line-height:1.6}
@media(max-width:700px){.brand h1{font-size:26px}}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  #app,#report .rbar,#toast{display:none!important}
  #report{display:block!important;background:#fff;padding:0}
  .pg{margin:0;box-shadow:none;page-break-after:always;width:297mm;min-height:209mm}
  .pg.green{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg h2.sh,table.rt th,.rswot>div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ===== නිල් තේමාව + පාද සටහන (report) ===== */
.pg{border-top:7mm solid #0f3d73;padding-bottom:21mm}
.pg.green{border-top-color:#0f3d73}
.pg h1.st{background:linear-gradient(90deg,#0f3d73,#1a5fa8);color:#fff;border:0;border-radius:8px}
.pg h2.sh,.band{background:linear-gradient(90deg,#0f3d73,#1a5fa8 70%,#2f80d1);color:#fff;border-radius:4px}
table.rt th{background:#dce9f7;color:#0f3d73}
table.rt th,table.rt td{border:1px solid #5b8fc7}
.cov-title{border:2.5px solid #0f3d73;border-radius:8px;color:#0f3d73;background:#fff}
.cov-mid img,.vmb>div,.ri{border-color:#1a5fa8}
.vmb>div{border-radius:10px;background:#f3f8fd}
.pg h3.sh3{color:#0f3d73;border-bottom:2px solid #2f80d1;padding-bottom:2px}
.pf{position:absolute;left:13mm;right:13mm;bottom:5mm;height:12mm;border-top:2.5px solid #1a5fa8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:10.5pt;color:#0f3d73}
.pf .pfl{text-align:left;font-weight:700}
.pf .pfc{text-align:center;font-weight:700;letter-spacing:.3px}
.pf .pfn{justify-self:end;width:9.5mm;height:9.5mm;border-radius:50%;background:#1a5fa8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11pt;box-shadow:0 0 0 1mm #fff,0 0 0 1.7mm #1a5fa8}
@media print{.pg,.pg h1.st,.pg h2.sh,.band,.pf .pfn,.cov-title,.vmb>div,table.rt th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.pg.cvf{padding:0;border-top:0;overflow:hidden;background:#fff;height:209mm;min-height:209mm}
.cvbg{position:absolute;left:0;top:0;width:100%;height:100%}
.cvlogo{position:absolute;left:50%;top:1.6%;transform:translateX(-50%);width:10.5mm;height:10.5mm;width:31mm;height:31mm;border-radius:50%;background:#fff;border:1mm solid #e8b923;padding:1.2mm;display:flex;align-items:center;justify-content:center;box-shadow:0 1mm 3mm rgba(0,0,0,.35)}
.cvlogo img{max-width:100%;max-height:100%;object-fit:contain;border-radius:50%}
.cvn,.cvy{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#0f3d73;font-weight:700;white-space:nowrap;overflow:hidden;font-family:'Yaldevi','Noto Sans Sinhala','AL',sans-serif}
.cvn{left:41.8%;width:41%;top:57.3%;height:9.1%}
.cvy{left:41.5%;width:37.5%;top:70.3%;height:8.5%;font-size:30pt}
.qb span.mc{background:#fff3d6;color:#8a4b00;font-weight:700;cursor:default}
tr.mcr td,tr.mcr th{background:#fff3d6!important;color:#8a4b00;font-weight:700}
@media print{.pg.cvf{height:209mm}}
#cm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:none;align-items:center;justify-content:center}
#cm .bx{background:#fff;border-radius:12px;padding:18px;max-width:480px;width:92%;max-height:90vh;overflow:auto}
#cm h3{margin:0 0 8px;color:var(--p)}#cm input,#cm textarea{width:100%;margin:4px 0}
#cm button{margin:4px 4px 0 0;padding:8px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;cursor:pointer}
#cm button.g{background:#e8f1fb;color:var(--p)}#cm .sm{font-size:13px;color:var(--mut)}
/* ===== නව අතුරු මුහුණත (layout) ===== */
:root{--bg:#f1f5fa;--line:#dce6f2}
body{background:var(--bg)}
#app{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto auto 1fr auto;min-height:100vh}
#app>header.brand{grid-column:1/-1;text-align:left;padding:12px 24px;background:linear-gradient(90deg,#0b2f5c,#1a5fa8 70%,#2f80d1);display:flex;align-items:center;gap:12px}
#app>header.brand::before{content:'📘';font-size:26px}
.brand .ttl{background:none;padding:0;margin:0;font-size:19px;border-radius:0;display:block}
#app>.bar{grid-column:1/-1;justify-content:flex-start;gap:8px;padding:9px 20px;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(15,61,115,.07)}
.bar button{border-radius:20px;padding:7px 14px;font-size:14px;border:1px solid var(--pb);background:#fff;color:var(--p)}
.bar button.pri{background:var(--p);color:#fff}
.bar button:hover,.bar button:nth-child(n):hover{background:#eaf2fc!important;color:#0f3d73!important;transform:none;box-shadow:none}
.bar button.pri:hover{background:#0f3d73!important;color:#fff!important}
#app>nav.tabs{grid-column:1;grid-row:3;display:block;overflow-y:auto;position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);background:#fff;border-right:1px solid var(--line);padding:6px 12px 24px}
#app>nav.tabs button{display:block;width:100%;text-align:left;border:0;border-radius:9px;background:transparent;color:#2f3e52;padding:9px 12px;margin:1px 0;font-weight:500;font-size:15px;white-space:normal;transform:none;box-shadow:none}
#app>nav.tabs button:hover{background:#eaf2fc;color:#0f3d73;transform:none;box-shadow:none}
#app>nav.tabs button.on{background:var(--p);color:#fff;font-weight:700}
.tg{font-size:12px;letter-spacing:.4px;color:#7a8aa0;font-weight:700;padding:16px 12px 5px;border-top:1px solid var(--line);margin-top:8px}
.tg:first-child{border-top:0;margin-top:0}
#app>main{grid-column:2;grid-row:3;max-width:1100px;width:100%;padding:22px 28px}
#app>footer.ft{grid-column:1/-1}
.card{border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(15,61,115,.06)}
.card h2{border-left:5px solid var(--p2);padding-left:11px;font-size:20px;margin-bottom:12px}
.card h3{padding-bottom:4px;border-bottom:1px dashed var(--pb)}
input,select,textarea{border:1px solid #c5d6ea;border-radius:9px;padding:8px 10px}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(47,128,209,.22);outline:none}
.grid2{gap:14px 20px}
table.et th{background:#e6f0fb;position:sticky;top:0}
table.et tr:nth-child(even) td:not(.c){background:#f8fbff}
.add{border-radius:20px;padding:7px 16px;background:#f4f9ff}
.navb button{border-radius:20px;padding:9px 22px}
.imgbox{border-radius:12px;background:#f7fbff}
@media(max-width:900px){#app{display:block}#app>nav.tabs{position:static;display:flex;overflow-x:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:8px}
#app>nav.tabs button{width:auto;white-space:nowrap}.tg{display:none}#app>main{padding:14px}.bar button{padding:6px 10px}}
#vbox{position:fixed;right:14px;bottom:14px;z-index:98;display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--p);border-radius:30px;padding:6px 10px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#vbox select{padding:4px 6px}
#vbtn{border:0;background:var(--p);color:#fff;border-radius:20px;padding:8px 14px;cursor:pointer;font-weight:700}
#vbtn.on{background:#c0392b;animation:vp 1s infinite}
#vst{font-size:13px;color:var(--mut);max-width:200px}
.vt{outline:3px solid #e67e22!important}
@keyframes vp{50%{opacity:.7}}
@media(max-width:700px){#vst{display:none}}
</style>

function compress(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1600;let w=im.width,h=im.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.82));};im.src=r.result;};r.readAsDataURL(file);}

/* ---------- charts (SVG) ---------- */
const COL=['#1a5fa8','#e67e22','#1e8e3e','#2c7fb8'];
function chart(title,labels,series,opt={}){ // series:[{n,v:[],type:'bar'|'line'}]
  const W=520,H=220,L=44,R=12,T=26,B=40,pw=W-L-R,ph=H-T-B;
  const all=series.flatMap(s=>s.v).filter(v=>v!=null);
  if(!all.length)return `<svg class="ch" viewBox="0 0 ${W} ${H}"><rect x="1" y="1" width="${W-2}" height="${H-2}" fill="none" stroke="#999"/><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="#888">${esc(title)} — දත්ත නැත</text></svg>`;
  let mx=Math.max(0,...all),mn=Math.min(0,...all);if(opt.pct&&mx<=100&&mn>=0)mx=100;if(mx===mn)mx=mn+1;
  const sc=v=>T+ph-(v-mn)/(mx-mn)*ph;
  let g=`<svg class="ch" viewBox="0 0 ${W} ${H}" font-family="AL,serif"><rect x="1" y="1" width="${W-2}" height="${H-2}" fill="#fff" stroke="#999"/><text x="${W/2}" y="17" text-anchor="middle" font-size="13" font-weight="700">${esc(title)}</text>`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=sc(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3e3e3"/><text x="${L-4}" y="${y+4}" text-anchor="end" font-size="10">${Math.round(v)}</text>`;}
  g+=`<line x1="${L}" x2="${W-R}" y1="${sc(0)}" y2="${sc(0)}" stroke="#555"/>`;
  const n=labels.length,cw=pw/n,bars=series.filter(s=>s.type!=='line'),bw=cw*0.7/Math.max(1,bars.length);
  bars.forEach((s,k)=>{const ci=series.indexOf(s);s.v.forEach((v,i)=>{if(v==null)return;const x=L+i*cw+cw*0.15+k*bw,y=Math.min(sc(v),sc(0)),h=Math.abs(sc(v)-sc(0));g+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${h}" fill="${COL[ci]}" opacity=".85"/><text x="${x+bw/2-1}" y="${v>=0?y-3:y+h+11}" text-anchor="middle" font-size="9">${f1(v)}</text>`;});});
  series.filter(s=>s.type==='line').forEach(s=>{const ci=series.indexOf(s);let d='';s.v.forEach((v,i)=>{if(v==null)return;const x=L+i*cw+cw/2,y=sc(v);d+=(d?'L':'M')+x+','+y;g+=`<circle cx="${x}" cy="${y}" r="3" fill="${COL[ci]}"/><text x="${x}" y="${y-6}" text-anchor="middle" font-size="9" fill="${COL[ci]}">${f1(v)}</text>`;});if(d)g+=`<path d="${d}" fill="none" stroke="${COL[ci]}" stroke-width="2"/>`;});
  labels.forEach((l,i)=>g+=`<text x="${L+i*cw+cw/2}" y="${T+ph+14}" text-anchor="middle" font-size="11">${l}</text>`);
  let lx=L;series.forEach((s,ci)=>{g+=`<rect x="${lx}" y="${H-14}" width="10" height="10" fill="${COL[ci]}"/><text x="${lx+14}" y="${H-5}" font-size="10.5">${esc(s.n)}</text>`;lx+=26+s.n.length*7;});
  return g+'</svg>';
}

 if(!c){h+='<p class="sm">Firebase console → Project settings → Your apps (Web) හි <b>firebaseConfig</b> එක මෙතැන paste කරන්න.</p><textarea id="cfgT" rows="7" placeholder="const firebaseConfig = {\n apiKey: &quot;...&quot;,\n authDomain: &quot;...&quot;,\n databaseURL: &quot;...&quot;, ..."></textarea><button onclick="fbDo(\'cfg\')">සුරකින්න</button>';}
 else if(!FBU){h+='<p class="sm">ඊමේල් + මුරපදයෙන් පිවිසෙන්න (පළමු වතාවට "ලියාපදිංචි වන්න").</p><input id="fe" type="email" placeholder="ඊමේල්"><input id="fp" type="password" placeholder="මුරපදය (අවම අකුරු 6)"><button onclick="fbDo(\'in\')">පිවිසෙන්න</button><button class="g" onclick="fbDo(\'up\')">ලියාපදිංචි වන්න</button><div style="margin-top:8px"><button class="g" onclick="fbDo(\'clr\')">Config මකන්න</button></div>';}
 else{h+='<p>පිවිසී ඇත: <b>'+esc(FBU.email)+'</b></p><p class="sm">වෙනස්කම් තත්පර කිහිපයකින් Cloud වෙත ස්වයංක්‍රීයව සුරැකේ.</p><button onclick="fbDo(\'push\')">⬆ දැන් Cloud වෙත සුරකින්න</button><button class="g" onclick="fbDo(\'pull\')">⬇ Cloud එකෙන් ගන්න</button><button class="g" onclick="fbDo(\'out\')">ඉවත් වන්න</button>';}
 h+='<div style="margin-top:10px"><button class="g" onclick="document.getElementById(\'cm\').style.display=\'none\'">වසන්න</button></div></div>';cmEl.innerHTML=h;}
async function fbDo(a){try{
 if(a==='cfg'){const t=document.getElementById('cfgT').value,o={};for(const m of t.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
  if(!o.databaseURL&&o.databaseurl)o.databaseURL=o.databaseurl;
  if(!o.apiKey||!o.databaseURL){toast('apiKey හා databaseURL අවශ්‍යයි (Realtime Database එකද සාදන්න)',1);return;}
  localStorage.setItem('aip_fbcfg',JSON.stringify(o));await fbInit();renderCloud();return;}
 if(a==='clr'){localStorage.removeItem('aip_fbcfg');renderCloud();return;}
 await fbInit();
 if(a==='in'||a==='up'){const e=document.getElementById('fe').value.trim(),p=document.getElementById('fp').value;
  if(a==='in')await FB.auth.signInWithEmailAndPassword(e,p);else await FB.auth.createUserWithEmailAndPassword(e,p);toast('✓ පිවිසුණා');}
 if(a==='out'){await FB.auth.signOut();setCs('');renderCloud();}
 if(a==='push')await fbPushNow(false);
 if(a==='pull')await fbPull(false);
}catch(e){toast('දෝෂය: '+(e.code||e.message),1);}}
document.getElementById('bCloud').onclick=()=>{cmEl.style.display='flex';renderCloud();if(fbCfg())fbInit().then(renderCloud).catch(()=>toast('Firebase පූරණය නොවීය — අන්තර්ජාලය පරීක්ෂා කරන්න',1));};
if(fbCfg())fbInit().catch(()=>{});

/* ---------- Google Maps link එකෙන් coordinates ගැනීම ---------- */
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||t.dataset.p!=='info.gps')return;const val=t.value.trim();if(!/^https?:\/\//i.test(val))return;
 const m=val.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||val.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||val.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/);
 if(m){const v=(+m[1]).toFixed(6)+' : '+(+m[2]).toFixed(6);sp('info.gps',v);t.value=v;toast('✓ Google Maps link එකෙන් GPS ගත්තා');}
 else if(/goo\.gl|maps\.app/i.test(val))toast('කෙටි link එකෙන් බැහැ — link එක ඇරලා address bar එකේ තියෙන සම්පූර්ණ link එක paste කරන්න',1);});

/* ---------- GPS ස්වයංක්‍රීයව ගැනීම ---------- */
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gps]');if(!b)return;
 if(!navigator.geolocation){toast('මෙම බ්‍රවුසරයේ GPS නැත',1);return;}
 toast('📍 ස්ථානය සොයමින්…');
 navigator.geolocation.getCurrentPosition(p=>{const v=p.coords.latitude.toFixed(6)+' : '+p.coords.longitude.toFixed(6);sp('info.gps',v);const el=document.querySelector('[data-p="info.gps"]');if(el)el.value=v;toast('✓ GPS එකතු විය (නිරවද්‍යතාව ≈ '+Math.round(p.coords.accuracy)+' m)');},
 er=>toast(er.code===1?'ස්ථාන (Location) අවසරය ලබා දෙන්න':'ස්ථානය ලබාගත නොහැක — https හෝ දුරකථනයෙන් උත්සාහ කරන්න',1),{enableHighAccuracy:true,timeout:15000});});

/* ---------- සිංහල කථනයෙන් ලිවීම (Voice typing) ---------- */
(function(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const box=document.createElement('div');box.id='vbox';
 box.innerHTML='<select id="vlang" title="භාෂාව"><option value="si-LK">සිංහල</option><option value="en-US">English</option></select><button id="vbtn" type="button">🎤 කථනයෙන් ලියන්න</button><span id="vst">කොටුවක් ඔබා 🎤 ඔබන්න</span>';
 document.getElementById('app').appendChild(box);
 const btn=document.getElementById('vbtn'),vst=document.getElementById('vst'),lang=document.getElementById('vlang');
 let rec=null,on=false,tp=null;
 const okEl=e=>e&&e.dataset&&e.dataset.p&&(e.tagName==='TEXTAREA'||(e.tagName==='INPUT'&&e.type==='text'));
 const mark=()=>{document.querySelectorAll('.vt').forEach(x=>x.classList.remove('vt'));if(tp){const e=document.querySelector(`[data-p="${CSS.escape(tp)}"]`);if(e)e.classList.add('vt');}};
 document.addEventListener('focusin',e=>{if(okEl(e.target)){tp=e.target.dataset.p;mark();if(!on)vst.textContent='✎ තෝරාගත් කොටුවට ලියවේ';}});
 btn.addEventListener('mousedown',e=>e.preventDefault());
 function put(t){
  if(!tp)return;const el=document.querySelector(`[data-p="${CSS.escape(tp)}"]`);
  const nl=/^\s*(ඊළඟ පේළිය|නව පේළිය|new line|next line)\s*$/i.test(t);
  let v=String(gp(tp)??'');
  if(nl){if(el&&el.tagName!=='TEXTAREA')return;if(!v||v.endsWith('\n'))return;v+='\n';}
  else{const a=t.trim();if(!a)return;v+=(!v||/\s$/.test(v)?'':' ')+a;}
  sp(tp,v);if(el){el.value=v;if(el.tagName==='TEXTAREA')el.scrollTop=el.scrollHeight;}
  if(tp==='info.name')updHdr();
 }
 function ui(){btn.classList.toggle('on',on);btn.textContent=on?'⏹ නවත්වන්න':'🎤 කථනයෙන් ලියන්න';if(!on)vst.textContent='කොටුවක් ඔබා 🎤 ඔබන්න';}
 function start(){
  if(!SR){toast('මෙම බ්‍රවුසරයේ කථන හඳුනාගැනීම නැත — Chrome හෝ Edge භාවිත කරන්න',1);return;}
  if(!tp){toast('මුලින් ලිවිය යුතු කොටුව ඔබන්න',1);return;}
  rec=new SR();rec.lang=lang.value;rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)put(r[0].transcript);else im+=r[0].transcript;}vst.textContent=im?'… '+im:'🎙 සවන් දෙමින්…';};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;toast('මයික්‍රෆෝන් අවසරය ලබා දෙන්න',1);}else if(e.error==='language-not-supported'){on=false;toast('මෙම උපාංගයේ සිංහල කථන හඳුනාගැනීම නැත',1);}};
  rec.onend=()=>{if(on){try{rec.start();}catch(x){}}else ui();};
  on=true;try{rec.start();}catch(x){}ui();
 }
 function stop(){on=false;try{rec.stop();}catch(e){}ui();}
 btn.onclick=()=>on?stop():start();
 lang.onchange=()=>{if(on){stop();setTimeout(start,400);}};
})();

load().then(()=>{try{cur=+(localStorage.getItem(KEY+'_tab')||0)||0;}catch(e){}
if(cur>=TABS.length)cur=0;renderTabs();render();updHdr();});
</script>
